<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Video Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090914;color:white;
  font-family:Arial,sans-serif;padding:25px;
}
main{max-width:650px;margin:50px auto}
h1{text-align:center;color:#a78bfa}
p{text-align:center;color:#aaa}
textarea{
  width:100%;height:140px;padding:16px;
  background:#17172a;color:white;
  border:1px solid #444;border-radius:12px;
  font-size:16px;resize:vertical;
}
button{
  width:100%;padding:16px;margin-top:15px;
  background:#7c3aed;color:white;
  border:0;border-radius:10px;font-size:17px;
}
#status{text-align:center;margin-top:20px}
#preview{
  width:100%;margin-top:20px;border-radius:12px;
  display:none;
}
</style>
</head>
<body>
<main>
<h1>My AI Video Generator</h1>
<p>Turn your imagination into video.</p>

<textarea id="prompt" placeholder="Describe the video you want to create..."></textarea>

<button id="generate">Generate Video</button>

<div id="status">Ready to generate.</div>
<video id="preview" controls></video>
</main>
</body>
</html>
